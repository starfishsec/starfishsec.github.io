# Build the static export and publish it to GitHub Pages on every push to main.
# configure-pages (enablement: true) switches the repo's Pages source to "GitHub Actions"
# on first run, so no manual Settings step is needed.
# Custom domain (starfishsec.com): set it under Settings → Pages; no basePath needed
# (the repo is the org site starfishsec.github.io, served at the domain root either way).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # This repo's history is mirrored to starfishsec/landingpage (private source mirror), where
    # Pages cannot be enabled (private repo on the free org plan) and configure-pages fails with
    # "Resource not accessible by integration". Only the Pages repo may deploy; everywhere else
    # both jobs skip and the run concludes green.
    if: github.repository == 'starfishsec/starfishsec.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
